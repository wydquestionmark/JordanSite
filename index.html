<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#000000"><meta name="description" content="A visual tribute to the Air Jordan 4 and Michael Jordan."><title>Nike Air Jordan 4 — Visual Tribute</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head><body>
<header class="site-header" id="top"><img class="wordmark" src="assets/wordmark.png" alt="nike air jordan 4"><nav class="socials" aria-label="Social media"><a href="https://x.com/Nike" target="_blank" rel="noopener noreferrer" aria-label="Nike on X, opens a new tab"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-7.4L5.5 22H2.3l7.3-8.5L1.9 2h6.5l4.4 6.8L18.9 2Zm-1.1 18h1.7L7.4 3.9H5.6L17.8 20Z"/></svg></a><a href="https://www.instagram.com/nike/?hl=en" target="_blank" rel="noopener noreferrer" aria-label="Nike on Instagram, opens a new tab"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r="1" fill="currentColor" stroke="none"/></svg></a></nav></header>
<main id="gallery"><div class="stage" aria-label="Air Jordan 4 visual gallery">
<button class="art detail bob-a" data-full="assets/detail-full.jpeg" aria-label="Enlarge black sneaker detail"><img src="assets/detail-full.jpeg" alt="Black Air Jordan 4 laces and tongue"></button>
<button class="art side bob-b video-art" data-full="assets/side-full.png" aria-label="Enlarge black sneaker side view"><img src="assets/side-full.png" alt="Black Air Jordan 4 side profile"><video class="hover-video" src="assets/side-hover.mp4" muted loop playsinline preload="metadata" aria-hidden="true"></video></button>
<button class="art action bob-c" data-full="assets/action-full.jpg" aria-label="Enlarge Michael Jordan basketball photograph"><img src="assets/action-full.jpg" alt="Michael Jordan shooting over defenders"></button>
<button class="art heel sway" data-full="assets/heel-full.png" aria-label="Enlarge black sneaker heel"><img src="assets/heel-full.png" alt="Black Air Jordan 4 heel with Nike Air branding"></button>
<section class="stats" aria-label="Michael Jordan career statistics"><div class="stat"><span class="stat-label">Minutes played</span><span class="stat-number" data-target="41011">0</span></div><div class="stat"><span class="stat-label">Points scored</span><span class="stat-number" data-target="32292">0</span></div><div class="stat"><span class="stat-label">MVPs</span><span class="stat-number" data-target="11">0</span></div><div class="stat"><span class="stat-label">All-Star appearances</span><span class="stat-number" data-target="14">0</span></div><div class="stat"><span class="stat-label">Championship rings</span><span class="stat-number" data-target="6">0</span></div><div class="stat"><span class="stat-label">Sneaker deals</span><span class="stat-number" data-target="1">0</span></div></section>
<button class="art celebration bob-b video-art" data-full="assets/jordan-celebration.jpg" aria-label="Enlarge Michael Jordan celebration photograph"><img src="assets/jordan-celebration.jpg" alt="Michael Jordan celebrating in a red Bulls jersey"><video class="hover-video" src="assets/celebration-hover.mp4" muted loop playsinline preload="metadata" aria-hidden="true"></video></button>
<button class="art leap bob-c video-art" data-full="assets/jordan-leap.jpg" aria-label="Play Michael Jordan video on hover; click to enlarge photograph"><img src="assets/jordan-leap.jpg" alt="Michael Jordan leaping in a red Bulls uniform"><video class="hover-video" src="assets/jordan-leap-hover.mp4" muted loop playsinline preload="metadata" aria-hidden="true"></video></button>

<img class="static-shoe grey-shoe" src="assets/jordan-grey-shoe.jpg" alt="Grey and white Air Jordan 4 on a black background">
<button class="art white-red bob-b" data-full="assets/jordan-white-red.jpg" aria-label="Enlarge white and red Air Jordan 4 photograph"><img src="assets/jordan-white-red.jpg" alt="White and red Air Jordan 4 resting on a shoebox"></button>
</div></main><footer>Just do it. &nbsp;|&nbsp; One Bowerman Drive, Beaverton, OR 97005, USA</footer>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged photograph" hidden><button class="lightbox-close" id="lightbox-close" aria-label="Close enlarged photograph">&times;</button><div class="lightbox-inner"><img id="lightbox-image" alt=""></div><p class="lightbox-hint">Press Esc or click outside the image to close</p></div></body></html>
